server.port=8040

spring.data.mongodb.username=${MONGO_USER:root}
spring.data.mongodb.password=${MONGO_PASSWORD:password}
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=notification
spring.data.mongodb.authentication-database=admin

spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=paymentGroup,orderGroup
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.properties.spring.json.trusted.packages='*'
spring.kafka.properties.spring.json.type.mapping=orderConfirmation:ru.app.notification.kafka.order.OrderConfirmation,paymentConfirmation:ru.app.notification.kafka.payment.PaymentConfirmation

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=${MAIL_DEV_USER:admin}
spring.mail.password=${MAIL_DEV_PASSWORD:admin}
spring.mail.properties.mail.smtp.trust='*'
spring.mail.properties.mail.auth=true
spring.mail.properties.mail.starttls.enabled=true
spring.mail.properties.mail.connectiontimeout=5000
spring.mail.properties.mail.timeout=3000
spring.mail.properties.mail.writetimeout=5000
